cvm-version: 0.14.17
cpus: 16
memory: 65536
gpus: 1

networks:
  dev:
    egress: open

volumes:
  - name: workspace
    exec: true

containers:
  - name: "workspace"
    image: "ghcr.io/tinfoilsh/confidential-debian@sha256:006b94dec2e15a21b0827dab6918c344d0f7f2bc7b9c6767f946528147bcdf00" # v0.2.0
    runtime: nvidia
    gpus: all
    restart: on-failure
    cvm_admin: true
    stop_signal: SIGRTMIN+3
    stop_timeout: 120
    networks: [dev]
    volumes: [workspace:/mnt/disk]

    ports: ["22:22"]

    env:
      - SSH_KEYS: |-
          ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKTVR8g4EyH7wlMnqk3/ljSDjN+Ph8E5dqUo6vJsY2vA

    tmpfs:
      /run: "rw,nosuid,nodev,mode=755"

    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

shim:
  upstream-port: 22
  authenticated: false
